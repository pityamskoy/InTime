name: vSrok
services:
  backend:
    image: leoagf/devback:1.14
    depends_on:
      - db
      - caddy
    restart: unless-stopped
    volumes:
      - app-volume:/static

  db:
    image: leoagf/bd:1.0
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "8082:8082"
    volumes:
      - caddy_data:/data
      - app-volume:/var/www/html
      - ./config/Caddyfile:/etc/caddy/Caddyfile

volumes:
  caddy_data:
  app-volume:
