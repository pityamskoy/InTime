name: vSrok
services:
  frontend:
    image: semayagi/vsrok-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"

  backend:
    image: leoagf/devback:1.9
    depends_on:
      - db
      - nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - app-volume:/static

  db:
    image: leoagf/devbd:2.2
    restart: unless-stopped

    ports:
      - "1234:5432"

  nginx:
    image: nginx:latest
    ports:
      - "1235:80"
    volumes:
      - app-volume:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  app-volume: